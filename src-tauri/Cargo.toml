[package]
name = "otr"
version = "0.2.0"
description = "Otae's Token Radar"
edition = "2021"

[lib]
name = "otr_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = "0.4"
zstd = "0.13"
dirs = "6"
thiserror = "2"
ureq = { version = "2.12", features = ["json"] }
base64 = "0.22"

# 凭据库按平台收窄:非 Windows 的 keyring 会拖进整套 zbus 依赖树,
# 而那边本来就走"请用环境变量"分支,不需要它。
[target.'cfg(windows)'.dependencies]
keyring = { version = "4", default-features = false, features = ["v1", "windows-native-keyring-store"] }

[profile.release]
strip = true
lto = true
