[package]
name = "otr"
version = "0.3.1"
description = "Otae's Token Radar"
edition = "2021"

[lib]
name = "otr_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = "0.4"
zstd = "0.13"
dirs = "6"
thiserror = "2"
ureq = { version = "2.12", features = ["json"] }
base64 = "0.22"

# 凭据库按平台收窄。Linux 的 keyring 会拖进整套 zbus,那边继续走环境变量。
# macOS 只用系统钥匙串(v1 里的 apple-native);zbus 依赖本身被 crate 限制在 Linux。
[target.'cfg(windows)'.dependencies]
keyring = { version = "4", default-features = false, features = ["v1", "windows-native-keyring-store"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "4", default-features = false, features = ["v1"] }

[profile.release]
strip = true
lto = true
